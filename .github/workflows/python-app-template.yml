name: Python App Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      app_path:
        required: true
        type: string
        # Caminho da aplicação (ex.: app/api, app/web)
      image_name:
        required: true
        type: string
        # Nome da imagem (sem usuário), ex.: lab-api-carro
    secrets:
      DOCKERHUB_USERNAME:
        required: true
        # Usuário do Docker Hub
      DOCKERHUB_TOKEN:
        required: true
        # Token de acesso do Docker Hub

jobs:
  lint:
    name: Lint (Ruff + Black)
    # Job 0: lint para falhar cedo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff
        run: |
          ruff check ${{ inputs.app_path }}

      - name: Run Black (check)
        run: |
          black --check ${{ inputs.app_path }}

  unit-tests:
    name: Unit Tests (Pytest)
    # Job 0: executa testes unitários da aplicação
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        # Necessário para acessar o código e os testes
        uses: actions/checkout@v4

      - name: Set up Python
        # Prepara o ambiente Python usado pelos testes
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Instala dependências da aplicação
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.app_path }}/requirements.txt

      - name: Run Pytest
        # Executa testes unitários (usa pytest.ini para saída mais detalhada)
        run: |
          pytest ${{ inputs.app_path }}/tests

  security-sast:
    name: Security Analysis (SAST)
    # Job 1: análise estática de segurança no código
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Busca o código do repositório para análise
        uses: actions/checkout@v4

      - name: Set up Python
        # Prepara o ambiente Python usado pelo Bandit
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit
        # Instala o scanner SAST de Python
        run: pip install bandit

      - name: Run Bandit (SAST)
        # Executa a análise estática do código
        run: bandit -r ${{ inputs.app_path }} -ll

  build-and-sca:
    name: Build and SCA Scan
    needs: security-sast
    # Job 2: build da imagem + varredura de vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Necessário para acessar o código e o histórico Git
        uses: actions/checkout@v4

      - name: Setup Pack CLI
        # Instala o Pack CLI (Buildpacks)
        uses: buildpacks/github-actions/setup-pack@v5.5.0

      - name: Login to Docker Hub
        # Autentica no Docker Hub para publicar imagens
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build with Buildpacks
        # Gera a imagem OCI com tag sequencial
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          VERSION=v${{ github.run_number }}
          SHA_TAG=sha-${{ github.sha }}
          BUILDER_IMAGE=paketobuildpacks/builder-jammy-base:latest

          echo "Building version: $VERSION"
          echo "Using builder: $BUILDER_IMAGE"
          pack builder inspect $BUILDER_IMAGE || true

          pack build $IMAGE_NAME:$VERSION \
            --path ${{ inputs.app_path }} \
            --builder $BUILDER_IMAGE \
            --pull-policy always

          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:$SHA_TAG

      - name: Run Trivy (SCA & Image Scan)
        # Escaneia dependências e imagem por CVEs críticos
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:v${{ github.run_number }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Image
        # Publica a imagem com a tag de versão e latest
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          VERSION=v${{ github.run_number }}
          SHA_TAG=sha-${{ github.sha }}

          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHA_TAG

      - name: Publish Image Digest
        # Registra o digest da imagem construída (latest)
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME:latest
