name: API DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/api/**'

jobs:
  security-sast:
    name: Security Analysis (SAST) - API
    # Job 1: análise estática de segurança no código da API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Busca o código do repositório para análise
        uses: actions/checkout@v4

      - name: Set up Python
        # Prepara o ambiente Python usado pelo Bandit
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit
        # Instala o scanner SAST de Python
        run: pip install bandit

      - name: Run Bandit (SAST)
        # Executa a análise estática do código da API
        run: bandit -r app/api -ll

  build-and-sca:
    name: Build and SCA Scan - API
    needs: security-sast
    # Job 2: build da imagem + varredura de vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Necessário para acessar o código da API e o histórico Git
        uses: actions/checkout@v4

      - name: Setup Pack CLI
        # Instala o Pack CLI (Buildpacks)
        uses: buildpacks/github-actions/setup-pack@v5.5.0

      - name: Login to Docker Hub
        # Autentica no Docker Hub para publicar imagens
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build with Buildpacks
        # Gera a imagem OCI com tag sequencial
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/lab-api-carro
          VERSION=v${{ github.run_number }}
          
          # Build gerando a tag de versão
          pack build $IMAGE_NAME:$VERSION \
            --path app/api \
            --builder gcr.io/buildpacks/builder:v1
          
          # Criamos a tag latest LOCALMENTE para o Trivy não se perder
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest

      - name: Run Trivy (SCA & Image Scan)
        # Escaneia dependências e imagem por CVEs críticos
        uses: aquasecurity/trivy-action@master
        with:
          # Escaneamos a 'latest' que acabamos de marcar localmente
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/lab-api-carro:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Image
        # Publica a imagem com a tag de versão e latest
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/lab-api-carro
          VERSION=v${{ github.run_number }}
          
          # Sobe a versão específica e a latest
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest
