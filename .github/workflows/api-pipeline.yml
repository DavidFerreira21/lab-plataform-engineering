name: API DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/api/**'

jobs:
  security-sast:
    name: Security Analysis (SAST) - API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (SAST)
        run: bandit -r app/api -ll

  build-and-sca:
    name: Build and SCA Scan - API
    needs: security-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.5.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build with Buildpacks
        run: |
          # Gerando a tag baseada no SHA do commit
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/lab-api-carro
          TAG=${GITHUB_SHA::7}
          
          pack build $IMAGE_NAME:$TAG \
            --path app/api \
            --builder gcr.io/buildpacks/builder:v1

          # Criando um alias 'latest' localmente para o Scan
          docker tag $IMAGE_NAME:$TAG $IMAGE_NAME:latest

      - name: Run Trivy (SCA & Image Scan)
        uses: aquasecurity/trivy-action@master
        with:
          # Escaneamos a tag específica
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/lab-api-carro:${{ github.sha }}'
          # ... (restante das configs do trivy)

      - name: Push Image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/lab-api-carro
          TAG=${GITHUB_SHA::7}
          
          # Sobe a versão específica e a latest
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest