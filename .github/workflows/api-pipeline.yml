name: API DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/api/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  api:
    # Wrapper: chama o workflow reutilizável com os parâmetros da API
    uses: ./.github/workflows/python-app-template.yml
    with:
      # Caminho da aplicação
      app_path: app/api
      # Nome da imagem no Docker Hub (sem usuário)
      image_name: lab-api-carro
    secrets:
      # Credenciais do Docker Hub
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
