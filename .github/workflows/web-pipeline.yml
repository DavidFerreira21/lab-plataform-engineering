name: Web DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/web/**'  # Ativa apenas se houver mudanças na pasta web

jobs:
  security-sast:
    name: Security Analysis (SAST) - Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (SAST)
        # Analisa o código Flask em busca de falhas de segurança
        run: bandit -r app/web -ll

  build-and-sca:
    name: Build and SCA Scan - Web
    needs: security-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.5.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build with Buildpacks
        # Constrói a imagem do front-end
        run: |
          pack build ${{ secrets.DOCKERHUB_USERNAME }}/lab-web-carro:latest \
            --path app/web \
            --builder gcr.io/buildpacks/builder:v1

      - name: Run Trivy (SCA & Image Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/lab-web-carro:latest'
          format: 'table'
          # Alteramos para falhar apenas em CRITICAL para este lab
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Web Image
        # Só faz o push se passar no scan de vulnerabilidades
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/lab-web-carro:latest