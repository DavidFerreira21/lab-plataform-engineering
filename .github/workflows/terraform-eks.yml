name: Terraform EKS

on:
  push:
    branches: ["main"]
    paths:
      - "plataforma/tf-modules/eks/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

jobs:
  terraform:
    name: Terraform (EKS Module)
    runs-on: ubuntu-latest
    env:
      TF_WORKDIR: plataforma/tf-modules/eks
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=${{ env.TF_WORKDIR }} init -upgrade

      - name: Terraform Validate
        run: terraform -chdir=${{ env.TF_WORKDIR }} validate

      - name: Terraform Plan
        if: ${{ github.event_name == 'push' || inputs.action == 'plan' }}
        run: terraform -chdir=${{ env.TF_WORKDIR }} plan -input=false

      - name: Terraform Apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' }}
        run: terraform -chdir=${{ env.TF_WORKDIR }} apply -auto-approve -input=false
