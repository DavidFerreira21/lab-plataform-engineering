apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-monorepo-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DavidFerreira21/lab-plataform-engineering.git'
    targetRevision: HEAD
    path: app # O Argo vai olhar api e web simultaneamente
    directory:
      recurse: true # Importante para ele ler as subpastas
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true