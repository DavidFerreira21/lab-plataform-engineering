apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xrds.platform.lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  group: platform.lab
  connectionSecretKeys:
    - host
    - port
    - username
    - database
  names:
    kind: XRDS
    plural: xrds
  claimNames:
    kind: RDS
    plural: rdss
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 3
                      maxLength: 32
                      pattern: "^[a-z][a-z0-9-]*$"
                    region:
                      type: string
                      default: us-east-1
                    engine:
                      type: string
                      default: postgres
                      enum:
                        - postgres
                        - mysql
                    engineVersion:
                      type: string
                      default: "16"
                    instanceClass:
                      type: string
                      default: db.t3.micro
                    allocatedStorage:
                      type: integer
                      default: 20
                      minimum: 20
                    dbName:
                      type: string
                      default: garagem
                    username:
                      type: string
                      default: appuser
                    passwordSecretName:
                      type: string
                    passwordSecretNamespace:
                      type: string
                    publiclyAccessible:
                      type: boolean
                      default: false
                    skipFinalSnapshot:
                      type: boolean
                      default: true
                    deletionPolicy:
                      type: string
                      default: Orphan
                      enum:
                        - Orphan
                        - Delete
                    providerConfigRefName:
                      type: string
                      default: default
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                  required:
                    - name
                    - passwordSecretName
                    - passwordSecretNamespace
              required:
                - parameters
            status:
              type: object
              properties:
                endpoint:
                  type: string
                port:
                  type: integer
                dbName:
                  type: string
                securityGroupId:
                  type: string
