# XRD do produto de plataforma "S3".
# Define o contrato do Claim (S3) e do Composite (XS3).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xs3s.platform.lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Grupo e tipos publicados pela API customizada.
  group: platform.lab
  writeConnectionSecretsToNamespace: app
  connectionSecretKeys:
    - bucketName
    - bucketArn
  names:
    kind: XS3
    plural: xs3s
  # Claim names: o que os times de app usam.
  claimNames:
    kind: S3
    plural: s3s
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            # Entradas aceitas no spec do claim/composite.
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 3
                      maxLength: 11
                      pattern: '^[a-z0-9][a-z0-9-]*[a-z0-9]$'
                    region:
                      type: string
                      default: us-east-1
                    deletionPolicy:
                      type: string
                      default: Orphan
                      enum:
                        - Orphan
                        - Delete
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    providerConfigRefName:
                      type: string
                      default: default
                  required:
                    - name
              required:
                - parameters
            # Campos publicados de volta pelo Composition.
            status:
              type: object
              properties:
                bucketName:
                  type: string
                bucketArn:
                  type: string
