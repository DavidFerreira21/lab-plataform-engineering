# XRD do produto de plataforma "IRSA".
# Modelo atual: o claim informa ServiceAccount + política (nome/documento).
# OIDC vem de EnvironmentConfig mantido pela plataforma.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xirsas.platform.lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Grupo e tipos publicados pela API customizada.
  group: platform.lab
  names:
    kind: XIRSA
    plural: xirsas
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            # Entradas aceitas no spec do claim/composite.
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    name:
                      type: string
                    serviceAccountNamespace:
                      type: string
                    serviceAccountName:
                      type: string
                    policyName:
                      type: string
                    policyDocument:
                      type: string
                    policyDescription:
                      type: string
                      default: "Managed policy for IRSA workload"
                    policyPath:
                      type: string
                      default: "/"
                    deletionPolicy:
                      type: string
                      default: Orphan
                      enum:
                        - Orphan
                        - Delete
                    providerConfigRefName:
                      type: string
                      default: default
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                  required:
                    - name
                    - serviceAccountNamespace
                    - serviceAccountName
                    - policyName
                    - policyDocument
              required:
                - parameters
            # Campos publicados de volta pelo Composition.
            status:
              type: object
              properties:
                roleArn:
                  type: string
                roleName:
                  type: string
                policyArn:
                  type: string
                policyName:
                  type: string
