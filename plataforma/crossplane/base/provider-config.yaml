# ProviderConfig padrão consumido por todos os recursos gerenciados na AWS.
# Usa credenciais via IRSA (sem secret estático).
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: IRSA
