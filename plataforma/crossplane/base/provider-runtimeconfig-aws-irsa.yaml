# RuntimeConfig compartilhado pelos providers AWS.
# Define como os pods dos providers devem ser executados.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: aws-irsa
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceAccountTemplate:
    metadata:
      # Nome fixo para o ServiceAccount do provider.
      # A annotation IRSA é aplicada dinamicamente pelo Terraform.
      # Keep the SA name stable and let Terraform manage the IRSA annotation dynamically per account.
      name: provider-aws
