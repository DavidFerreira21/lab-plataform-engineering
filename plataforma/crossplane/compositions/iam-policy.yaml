apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: iampolicy.aws.platform.lab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    platform.lab/provider: aws
    platform.lab/type: iam-policy
spec:
  compositeTypeRef:
    apiVersion: platform.lab/v1alpha1
    kind: XIAMPolicy
  resources:
    - name: policy
      base:
        apiVersion: iam.aws.upbound.io/v1beta1
        kind: Policy
        metadata:
          annotations:
            crossplane.io/external-name: ""
        spec:
          deletionPolicy: Orphan
          forProvider:
            description: "Managed policy for platform workloads"
            path: "/"
            policy: "{}"
            tags: {}
          providerConfigRef:
            name: default
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.name
          toFieldPath: metadata.annotations[crossplane.io/external-name]
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.policyDocument
          toFieldPath: spec.forProvider.policy
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.description
          toFieldPath: spec.forProvider.description
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.path
          toFieldPath: spec.forProvider.path
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.tags
          toFieldPath: spec.forProvider.tags
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.deletionPolicy
          toFieldPath: spec.deletionPolicy
        - type: FromCompositeFieldPath
          fromFieldPath: spec.parameters.providerConfigRefName
          toFieldPath: spec.providerConfigRef.name
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.arn
          toFieldPath: status.policyArn
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.annotations[crossplane.io/external-name]
          toFieldPath: status.policyName
