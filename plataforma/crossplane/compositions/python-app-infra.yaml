apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: python-app-infra.aws.platform.lab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    platform.lab/provider: aws
    platform.lab/type: python-app-infra
spec:
  compositeTypeRef:
    apiVersion: platform.lab/v1alpha1
    kind: XPythonAppInfra
  mode: Pipeline
  pipeline:
    # Carrega metadados dinâmicos da conta/cluster (accountId, OIDC, VPC, etc.)
    - step: environment-configs
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: cluster-aws-metadata

    # Cria e conecta todos os recursos AWS/Kubernetes a partir dos parâmetros do XR
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # Bucket principal da aplicação (nome determinístico por conta/região)
          - name: s3-bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta2
              kind: Bucket
              metadata:
                annotations:
                  crossplane.io/external-name: ""
              spec:
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
                  tags: {}
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromEnvironment
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-%s-%s"
                  variables:
                    - fromFieldPath: region
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags
                toFieldPath: spec.forProvider.tags
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.bucketName

          # Hardening do bucket: bloqueio de acesso público
          - name: s3-public-access-block
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              spec:
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
                  blockPublicAcls: true
                  blockPublicPolicy: true
                  ignorePublicAcls: true
                  restrictPublicBuckets: true
                  bucket: ""
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.bucket
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-%s-%s"
                  variables:
                    - fromFieldPath: region
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Hardening do bucket: criptografia server-side
          - name: s3-encryption
            base:
              apiVersion: s3.aws.upbound.io/v1beta2
              kind: BucketServerSideEncryptionConfiguration
              spec:
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
                  bucket: ""
                  rule:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: AES256
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.bucket
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-%s-%s"
                  variables:
                    - fromFieldPath: region
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Hardening do bucket: versionamento habilitado
          - name: s3-versioning
            base:
              apiVersion: s3.aws.upbound.io/v1beta2
              kind: BucketVersioning
              spec:
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
                  bucket: ""
                  versioningConfiguration:
                    status: Enabled
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.bucket
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-%s-%s"
                  variables:
                    - fromFieldPath: region
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Secret Kubernetes consumido pela app com o nome do bucket
          - name: s3-connection-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: ""
                      namespace: app
                    type: Opaque
                    stringData:
                      bucketName: ""
                providerConfigRef:
                  name: default-kubernetes
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.s3ConnectionSecretName
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.manifest.stringData.bucketName
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-%s-%s"
                  variables:
                    - fromFieldPath: region
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.kubernetesProviderConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Policy IAM para acesso ao bucket (List/Get/Put/Delete)
          - name: irsa-policy
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: Policy
              metadata:
                annotations:
                  crossplane.io/external-name: ""
              spec:
                deletionPolicy: Orphan
                forProvider:
                  description: S3 access policy for app workload
                  path: /
                  policy: "{}"
                  tags: {}
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromComposite
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                combine:
                  strategy: string
                  string:
                    fmt: "%s-irsa-policy"
                  variables:
                    - fromFieldPath: spec.parameters.name
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.policy
                combine:
                  strategy: string
                  string:
                    fmt: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::api-storage-%s-%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::api-storage-%s-%s/*"]}]}'
                  variables:
                    - fromFieldPath: region
                    - fromFieldPath: accountId
                    - fromFieldPath: region
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags
                toFieldPath: spec.forProvider.tags
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.irsaPolicyArn

          # Role IAM assumida pelo ServiceAccount via IRSA
          - name: irsa-role
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: Role
              metadata:
                annotations:
                  crossplane.io/external-name: ""
              spec:
                deletionPolicy: Orphan
                forProvider:
                  assumeRolePolicy: "{}"
                  tags: {}
                providerConfigRef:
                  name: default
            patches:
              - type: ToEnvironmentFieldPath
                fromFieldPath: spec.parameters.namespace
                toFieldPath: namespace
              - type: ToEnvironmentFieldPath
                fromFieldPath: spec.parameters.serviceAccountName
                toFieldPath: serviceAccountName
              - type: CombineFromComposite
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                combine:
                  strategy: string
                  string:
                    fmt: "%s-irsa"
                  variables:
                    - fromFieldPath: spec.parameters.name
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.assumeRolePolicy
                combine:
                  strategy: string
                  string:
                    fmt: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"%s"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"%s:aud":"sts.amazonaws.com","%s:sub":"system:serviceaccount:%s:%s"}}}]}'
                  variables:
                    - fromFieldPath: oidcProviderArn
                    - fromFieldPath: oidcIssuerHostpath
                    - fromFieldPath: oidcIssuerHostpath
                    - fromFieldPath: namespace
                    - fromFieldPath: serviceAccountName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags
                toFieldPath: spec.forProvider.tags
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.roleArn

          # Anexa a policy criada na role IRSA
          - name: irsa-role-policy-attachment
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                deletionPolicy: Orphan
                forProvider:
                  role: ""
                  policyArn: ""
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.role
                combine:
                  strategy: string
                  string:
                    fmt: "%s-irsa"
                  variables:
                    - fromFieldPath: spec.parameters.name
              - type: FromCompositeFieldPath
                fromFieldPath: status.irsaPolicyArn
                toFieldPath: spec.forProvider.policyArn
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # ServiceAccount da aplicação já anotada com role-arn
          - name: app-service-account
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                      name: api-carro
                      namespace: app
                      annotations:
                        eks.amazonaws.com/role-arn: ""
                providerConfigRef:
                  name: default-kubernetes
            patches:
              - type: ToEnvironmentFieldPath
                fromFieldPath: spec.parameters.name
                toFieldPath: name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.serviceAccountName
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.manifest.metadata.annotations[eks.amazonaws.com/role-arn]
                combine:
                  strategy: string
                  string:
                    fmt: "arn:aws:iam::%s:role/%s-irsa"
                  variables:
                    - fromFieldPath: accountId
                    - fromFieldPath: name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.kubernetesProviderConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Security Group dedicado para o banco
          - name: db-security-group
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroup
              spec:
                deletionPolicy: Orphan
                forProvider:
                  description: Security group for app database
                  name: ""
                  region: us-east-1
                  vpcId: ""
                  tags: {}
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.name
                combine:
                  strategy: string
                  string:
                    fmt: "%s-db-sg"
                  variables:
                    - fromFieldPath: spec.parameters.name
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.vpcId
                combine:
                  strategy: string
                  string:
                    fmt: "%s"
                  variables:
                    - fromFieldPath: vpcId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags
                toFieldPath: spec.forProvider.tags
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.dbSecurityGroupId

          # Regra de ingress do SG (porta do banco a partir da VPC do cluster)
          - name: db-security-group-ingress
            base:
              apiVersion: ec2.aws.upbound.io/v1beta1
              kind: SecurityGroupRule
              spec:
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
                  type: ingress
                  protocol: tcp
                  fromPort: 5432
                  toPort: 5432
                  cidrBlocks:
                    - ""
                  securityGroupId: ""
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: status.dbSecurityGroupId
                toFieldPath: spec.forProvider.securityGroupId
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.cidrBlocks[0]
                combine:
                  strategy: string
                  string:
                    fmt: "%s"
                  variables:
                    - fromFieldPath: vpcCidrBlock
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Instância RDS e publicação do secret de conexão no namespace da app
          - name: db-instance
            base:
              apiVersion: rds.aws.upbound.io/v1beta1
              kind: Instance
              metadata:
                annotations:
                  crossplane.io/external-name: ""
              spec:
                deletionPolicy: Orphan
                writeConnectionSecretToRef:
                  namespace: app
                  name: ""
                forProvider:
                  allocatedStorage: 20
                  engine: postgres
                  engineVersion: "16"
                  instanceClass: db.t3.micro
                  dbName: garagem
                  username: appuser
                  publiclyAccessible: false
                  skipFinalSnapshot: true
                  autoMinorVersionUpgrade: true
                  vpcSecurityGroupIds: []
                  passwordSecretRef:
                    namespace: app
                    name: ""
                    key: password
                  region: us-east-1
                  tags: {}
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromComposite
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                combine:
                  strategy: string
                  string:
                    fmt: "%s-db"
                  variables:
                    - fromFieldPath: spec.parameters.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbEngine
                toFieldPath: spec.forProvider.engine
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbEngineVersion
                toFieldPath: spec.forProvider.engineVersion
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbInstanceClass
                toFieldPath: spec.forProvider.instanceClass
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbAllocatedStorage
                toFieldPath: spec.forProvider.allocatedStorage
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbName
                toFieldPath: spec.forProvider.dbName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbUsername
                toFieldPath: spec.forProvider.username
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbPasswordSecretName
                toFieldPath: spec.forProvider.passwordSecretRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbPasswordSecretNamespace
                toFieldPath: spec.forProvider.passwordSecretRef.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbConnectionSecretName
                toFieldPath: spec.writeConnectionSecretToRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.namespace
                toFieldPath: spec.writeConnectionSecretToRef.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbPubliclyAccessible
                toFieldPath: spec.forProvider.publiclyAccessible
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.dbSkipFinalSnapshot
                toFieldPath: spec.forProvider.skipFinalSnapshot
              - type: FromCompositeFieldPath
                fromFieldPath: status.dbSecurityGroupId
                toFieldPath: spec.forProvider.vpcSecurityGroupIds[0]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags
                toFieldPath: spec.forProvider.tags
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.address
                toFieldPath: status.dbEndpoint
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.port
                toFieldPath: status.dbPort
