apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: python-app-infra.aws.platform.lab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    platform.lab/provider: aws
    platform.lab/type: python-app-infra
spec:
  compositeTypeRef:
    apiVersion: platform.lab/v1alpha1
    kind: XPythonAppInfra
  mode: Pipeline
  pipeline:
    - step: environment-configs
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: cluster-aws-metadata

    - step: render-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := getCompositeResource . -}}
            {{- $p := $xr.spec.parameters -}}
            {{- $env := index .context "apiextensions.crossplane.io/environment" -}}
            {{- $region := $p.region -}}
            {{- $accountId := index $env "accountId" -}}
            {{- $oidcProviderArn := index $env "oidcProviderArn" -}}
            {{- $oidcIssuerHostpath := index $env "oidcIssuerHostpath" -}}
            {{- $vpcId := index $env "vpcId" -}}
            {{- $vpcCidrBlock := index $env "vpcCidrBlock" -}}
            {{- $bucketName := printf "api-storage-%s-%s" $region $accountId -}}

            {{- $enableS3 := true -}}
            {{- if hasKey $p "enableS3" -}}
            {{- $enableS3 = $p.enableS3 -}}
            {{- end -}}
            {{- $enableDB := true -}}
            {{- if hasKey $p "enableDatabase" -}}
            {{- $enableDB = $p.enableDatabase -}}
            {{- end -}}

            {{- if $enableS3 }}
            ---
            apiVersion: s3.aws.upbound.io/v1beta2
            kind: Bucket
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: s3-bucket
                crossplane.io/external-name: {{ $bucketName }}
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                region: {{ $region }}
                tags:
            {{ toYaml $p.tags | indent 6 }}
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: s3.aws.upbound.io/v1beta1
            kind: BucketPublicAccessBlock
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: s3-public-access-block
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                region: {{ $region }}
                bucket: {{ $bucketName }}
                blockPublicAcls: true
                blockPublicPolicy: true
                ignorePublicAcls: true
                restrictPublicBuckets: true
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: s3.aws.upbound.io/v1beta2
            kind: BucketServerSideEncryptionConfiguration
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: s3-encryption
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                region: {{ $region }}
                bucket: {{ $bucketName }}
                rule:
                  - applyServerSideEncryptionByDefault:
                      sseAlgorithm: AES256
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: s3.aws.upbound.io/v1beta2
            kind: BucketVersioning
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: s3-versioning
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                region: {{ $region }}
                bucket: {{ $bucketName }}
                versioningConfiguration:
                  status: Enabled
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: s3-connection-secret
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $p.s3ConnectionSecretName }}
                    namespace: {{ $p.namespace }}
                  type: Opaque
                  stringData:
                    bucketName: {{ $bucketName }}
              providerConfigRef:
                name: {{ $p.kubernetesProviderConfigRefName }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Policy
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: irsa-policy
                crossplane.io/external-name: {{ printf "%s-irsa-policy" $p.name }}
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                description: S3 access policy for app workload
                path: /
                policy: |
                  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::{{ $bucketName }}"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::{{ $bucketName }}/*"]}]}
                tags:
            {{ toYaml $p.tags | indent 6 }}
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: irsa-role
                crossplane.io/external-name: {{ printf "%s-irsa" $p.name }}
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                assumeRolePolicy: |
                  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"{{ $oidcProviderArn }}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"{{ $oidcIssuerHostpath }}:aud":"sts.amazonaws.com","{{ $oidcIssuerHostpath }}:sub":"system:serviceaccount:{{ $p.namespace }}:{{ $p.serviceAccountName }}"}}}]}
                tags:
            {{ toYaml $p.tags | indent 6 }}
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicyAttachment
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: irsa-role-policy-attachment
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                role: {{ printf "%s-irsa" $p.name }}
                policyArnSelector:
                  matchControllerRef: true
                  matchLabels:
                    gotemplating.fn.crossplane.io/composition-resource-name: irsa-policy
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}
            {{- end }}

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: app-service-account
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: {{ $p.serviceAccountName }}
                    namespace: {{ $p.namespace }}
                    annotations:
            {{- if $enableS3 }}
                      eks.amazonaws.com/role-arn: {{ printf "arn:aws:iam::%s:role/%s-irsa" $accountId $p.name }}
            {{- else }}
                      {}
            {{- end }}
              providerConfigRef:
                name: {{ $p.kubernetesProviderConfigRefName }}

            {{- if $enableDB }}
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: SecurityGroup
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-security-group
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                description: Security group for app database
                name: {{ printf "%s-db-sg" $p.name }}
                region: {{ $region }}
                vpcId: {{ $vpcId }}
                tags:
            {{ toYaml $p.tags | indent 6 }}
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: SecurityGroupRule
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-security-group-ingress
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              forProvider:
                region: {{ $region }}
                type: ingress
                protocol: tcp
                fromPort: 5432
                toPort: 5432
                cidrBlocks:
                  - {{ $vpcCidrBlock }}
                securityGroupIdSelector:
                  matchControllerRef: true
                  matchLabels:
                    gotemplating.fn.crossplane.io/composition-resource-name: db-security-group
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            ---
            apiVersion: rds.aws.upbound.io/v1beta1
            kind: Instance
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-instance
                crossplane.io/external-name: {{ printf "%s-db" $p.name }}
            spec:
              deletionPolicy: {{ $p.deletionPolicy }}
              writeConnectionSecretToRef:
                namespace: {{ $p.namespace }}
                name: {{ $p.dbConnectionSecretName }}
              forProvider:
                allocatedStorage: {{ $p.dbAllocatedStorage }}
                engine: {{ $p.dbEngine }}
                engineVersion: "{{ $p.dbEngineVersion }}"
                instanceClass: {{ $p.dbInstanceClass }}
                dbName: {{ $p.dbName }}
                username: {{ $p.dbUsername }}
                publiclyAccessible: {{ $p.dbPubliclyAccessible }}
                skipFinalSnapshot: {{ $p.dbSkipFinalSnapshot }}
                autoMinorVersionUpgrade: true
                manageMasterUserPassword: true
                vpcSecurityGroupIdSelector:
                  matchControllerRef: true
                  matchLabels:
                    gotemplating.fn.crossplane.io/composition-resource-name: db-security-group
                region: {{ $region }}
                tags:
            {{ toYaml $p.tags | indent 6 }}
              providerConfigRef:
                name: {{ $p.providerConfigRefName }}

            {{- $dbObserved := getComposedResource . "db-instance" -}}
            {{- if $dbObserved }}
            {{- $dbSecretArn := dig "resource" "status" "atProvider" "masterUserSecret" 0 "secretArn" "" $dbObserved -}}
            {{- if ne $dbSecretArn "" }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: db-password-external-secret
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1beta1
                  kind: ExternalSecret
                  metadata:
                    name: {{ printf "%s-db-password-sync" $p.name }}
                    namespace: {{ $p.namespace }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: {{ $p.dbPasswordSecretStoreName }}
                    target:
                      name: {{ $p.dbPasswordSecretName }}
                      creationPolicy: Owner
                    data:
                      - secretKey: password
                        remoteRef:
                          key: {{ $dbSecretArn }}
                          property: password
              providerConfigRef:
                name: {{ $p.kubernetesProviderConfigRefName }}
            {{- end }}
            {{- end }}
            {{- end }}
