# Composition do XS3.
# Traduz o claim S3 em múltiplos recursos AWS (bucket + segurança).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: s3.aws.platform.lab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    platform.lab/provider: aws
spec:
  # Tipo composto que esta Composition atende.
  compositeTypeRef:
    apiVersion: platform.lab/v1alpha1
    kind: XS3

  # Crossplane 2.x: composição em modo Pipeline.
  mode: Pipeline
  pipeline:
    - step: environment-configs
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: cluster-aws-metadata

    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # Recurso principal: bucket.
          - name: bucket
            base:
              apiVersion: s3.aws.upbound.io/v1beta2
              kind: Bucket
              metadata:
                annotations:
                  crossplane.io/external-name: ""
              spec:
                deletionPolicy: Orphan
                forProvider:
                  region: us-east-1
                  tags: {}
                providerConfigRef:
                  name: default
            connectionDetails:
              - name: bucketName
                type: FromFieldPath
                fromFieldPath: status.atProvider.id
              - name: bucketArn
                type: FromFieldPath
                fromFieldPath: status.atProvider.arn
            patches:
              # Nome externo único e estável durante o ciclo do claim.
              - type: CombineFromEnvironment
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-us-east-1-%s"
                  variables:
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.tags
                toFieldPath: spec.forProvider.tags
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.bucketName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.bucketArn

          # Hardenização: bloqueio de acesso público no bucket.
          - name: bucket-public-access-block
            base:
              apiVersion: s3.aws.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              spec:
                forProvider:
                  region: us-east-1
                  blockPublicAcls: true
                  blockPublicPolicy: true
                  ignorePublicAcls: true
                  restrictPublicBuckets: true
                  bucket: ""
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.bucket
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-us-east-1-%s"
                  variables:
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Hardenização: criptografia server-side padrão.
          - name: bucket-encryption
            base:
              apiVersion: s3.aws.upbound.io/v1beta2
              kind: BucketServerSideEncryptionConfiguration
              spec:
                forProvider:
                  region: us-east-1
                  bucket: ""
                  rule:
                    - applyServerSideEncryptionByDefault:
                        sseAlgorithm: AES256
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.bucket
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-us-east-1-%s"
                  variables:
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name

          # Governança: versionamento habilitado.
          - name: bucket-versioning
            base:
              apiVersion: s3.aws.upbound.io/v1beta2
              kind: BucketVersioning
              spec:
                forProvider:
                  region: us-east-1
                  bucket: ""
                  versioningConfiguration:
                    status: Enabled
                providerConfigRef:
                  name: default
            patches:
              - type: CombineFromEnvironment
                toFieldPath: spec.forProvider.bucket
                combine:
                  strategy: string
                  string:
                    fmt: "api-storage-us-east-1-%s"
                  variables:
                    - fromFieldPath: accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRefName
                toFieldPath: spec.providerConfigRef.name
