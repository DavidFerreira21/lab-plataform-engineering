apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-template.fullname" . | quote }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "app-template.fullname" . | quote }}
  template:
    metadata:
      labels:
        app: {{ include "app-template.fullname" . | quote }}
    spec:
{{- $sa := .Values.serviceAccount | default dict }}
{{- $irsa := .Values.irsa | default dict }}
{{- if or $sa.create $sa.name }}
      serviceAccountName: {{ include "app-template.serviceAccountName" . | quote }}
{{- end }}
      containers:
        - name: {{ .Chart.Name | quote }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
{{- if or (and $irsa.enabled $irsa.roleArn) .Values.env }}
          env:
{{- if and $irsa.enabled $irsa.roleArn }}
            - name: AWS_ROLE_ARN
              value: {{ $irsa.roleArn | quote }}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/eks.amazonaws.com/serviceaccount/token"
{{- end }}
{{- if .Values.env }}
{{ toYaml .Values.env | indent 12 }}
{{- end }}
{{- end }}
{{- if and $irsa.enabled $irsa.roleArn }}
          volumeMounts:
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
{{- end }}
          ports:
            - containerPort: {{ .Values.service.targetPort | default .Values.service.port }}
{{- if .Values.resources }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- end }}
{{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: {{ .Values.service.targetPort | default .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds | default 2 }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | default 3 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: {{ .Values.service.targetPort | default .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds | default 2 }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | default 3 }}
{{- end }}
{{- if and $irsa.enabled $irsa.roleArn }}
      volumes:
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
{{- end }}
