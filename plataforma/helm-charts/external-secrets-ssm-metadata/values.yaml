store:
  # ClusterSecretStore do External Secrets para leitura no AWS SSM Parameter Store.
  name: aws-parameterstore
  region: us-east-1
  serviceAccountNamespace: external-secrets
  serviceAccountName: external-secrets

externalSecret:
  # Secret de metadados do cluster consumido pelo EnvironmentConfig do Crossplane.
  name: cluster-aws-metadata
  namespace: app
  refreshInterval: 1h
  targetSecretName: cluster-aws-metadata
  metadataPrefix: /platform/bootstrap
  clusterName: eks-dev

s3BucketSecret:
  # Mantido desabilitado: o bucket da aplicação agora vem do XPythonAppInfra.
  enabled: false
  name: api-storage-conn
  namespace: app
  refreshInterval: 1h
  bucketPrefix: api-storage
