{{- $base := printf "/%s/%s" (trimPrefix "/" .Values.externalSecret.metadataPrefix) .Values.externalSecret.clusterName -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}
  namespace: {{ .Values.externalSecret.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.store.name }}
  target:
    name: {{ .Values.externalSecret.targetSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: oidcProviderArn
      remoteRef:
        key: {{ printf "%s/oidc/provider_arn" $base | quote }}
    - secretKey: oidcIssuerHostpath
      remoteRef:
        key: {{ printf "%s/oidc/issuer_hostpath" $base | quote }}
    - secretKey: accountId
      remoteRef:
        key: {{ printf "%s/account/id" $base | quote }}
