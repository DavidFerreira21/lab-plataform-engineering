apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.store.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.store.serviceAccountName | quote }}
            namespace: {{ .Values.store.serviceAccountNamespace | quote }}
