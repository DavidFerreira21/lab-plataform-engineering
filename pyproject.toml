[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \.venv
  | venv
  | \.__pycache__
  | build
  | dist
  | \.eggs
)/
'''

[tool.ruff]
line-length = 88
src = ["app"]
exclude = [".venv", "venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
