app-template:
  replicaCount: 1
  image:
    repository: david210/lab-api-carro
    tag: latest
  service:
    port: 80
    targetPort: 8000
  env:
    - name: API_URL
      value: "http://api-carro-svc:80/carros"
    - name: FLASK_DEBUG
      value: "true"
  
  ingress:
    enabled: false
    host: api.local
