app-template:
  replicaCount: 1
  image:
    repository: david210/lab-api-carro
    tag: latest
  service:
    port: 80
    targetPort: 8000
    name: api-carro-svc
  env:
    - name: S3_ENDPOINT
      value: "http://minio:9000"
    - name: S3_BUCKET
      value: "carros"
    - name: S3_ACCESS_KEY
      value: "minioadmin"
    - name: S3_SECRET_KEY
      value: "minioadmin"
    - name: S3_REGION
      value: "us-east-1"
    - name: S3_USE_SSL
      value: "false"
    - name: API_URL
      value: "http://api-carro-svc:80/carros"
    - name: FLASK_DEBUG
      value: "true"
  
  ingress:
    enabled: false
    host: api.local
  probes:
    enabled: true
    readiness:
      path: /carros
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 5
    liveness:
      path: /carros
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 5
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
