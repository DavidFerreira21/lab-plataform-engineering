<!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Carros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Cadastrar Novo Carro</h2>
    <form action="/cadastrar" method="post" class="row g-3">
        <div class="col-md-4"><input type="text" name="marca" class="form-control" placeholder="Marca" required></div>
        <div class="col-md-4"><input type="text" name="modelo" class="form-control" placeholder="Modelo" required></div>
        <div class="col-md-2"><input type="number" name="ano" class="form-control" placeholder="Ano" required></div>
        <div class="col-md-2"><button type="submit" class="btn btn-success w-100">Salvar</button></div>
    </form>

    <hr>

    <h3>Carros Cadastrados</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for carro in carros %}
            <tr>
                <td>{{ carro.id }}</td>
                <td>{{ carro.marca }}</td>
                <td>{{ carro.modelo }}</td>
                <td>{{ carro.ano }}</td>
                <td>
                    <a href="/excluir/{{ carro.id }}" class="btn btn-danger btn-sm">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
